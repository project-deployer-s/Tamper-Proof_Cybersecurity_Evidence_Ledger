<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inbox - Evidence Ledger</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
  <div class="shell">
    <nav class="rail" id="rail" aria-label="Main"></nav>
    <main class="main" id="main">
      <header class="page-head">
        <h1>Inbox</h1>
        <p>Open a message and check it. Each check tells you who really sent it and whether it was changed.</p>
      </header>

      <div class="row" style="margin-bottom:14px">
        <button class="btn secondary" type="button" id="check-all">Check all unchecked</button>
      </div>

      <div class="split">
        <ul class="msg-list" id="list" aria-label="Messages"></ul>
        <section class="panel" id="detail" aria-live="polite"></section>
      </div>
    </main>
  </div>
  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script src="/static/js/mock-api.js"></script>
  <script src="/static/js/app.js"></script>
  <script src="/static/js/inbox.js"></script>
</body>
</html>
